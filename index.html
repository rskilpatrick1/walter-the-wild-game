  },
  cat: {
    room: 40,
    start() {},
    update(c) {
      const k = CAST.cat, t = c.t;
      let side = TRAIL_HALF - 0.6, fwd = 5.5 + Math.sin(t * 0.9) * 0.6;
      if (t < 1.2) side = 9 - (9 - side) * ease(t / 1.2);           // pops out of the woods
      if (t > 6.8) side += 12 * ease((t - 6.8) / 1.2);              // darts back in
      nearWalter(k.group, fwd, side, Math.abs(Math.sin(t * 10)) * 0.06);
      k.group.rotation.y = w.viewAng + (t < 1.2 ? 0.8 : t > 6.8 ? -0.9 : 0);
      runLegs(k.legs, t, 20, 0.75);
      k.tail.forEach((link, i) => (link.rotation.z = Math.sin(t * 4 - i) * 0.25));
      if (t > 0.8 && once(c, "said")) { speak("cat", c.line); sfx("meow"); }
      if (t > 4.5 && once(c, "meow2")) sfx("meow");
      return t < 8.2;
    },
    end() {},
  },
};

function updateCameos(dt, progress) {
  if (!cameo && cameoNext < CAMEOS.length && progress >= CAMEOS[cameoNext].at) {
    const c = CAMEOS[cameoNext], seg = route[w.seg];
    // Wait for a long enough stretch of straight trail.
    if (seg.len - w.s > ACTORS[c.who].room) {
      cameo = Object.assign({ t: 0 }, c);
      cameoNext++;
      CAST[c.who].group.visible = true;
      ACTORS[c.who].start(cameo);
    }
  }
  if (cameo) {
    cameo.t += dt;
    if (!ACTORS[cameo.who].update(cameo, dt)) stopCameo();
  }
}
function stopCameo() {
  if (!cameo) return;
  ACTORS[cameo.who].end(cameo);
  CAST[cameo.who].group.visible = false;
  cameo = null;
}

// Add a star to a segment during the run (Major's gift).
function addStar(seg, s, lat, y) {
  const it = { kind: "star", s, lat, y, taken: false };
  seg.items.push(it);
  game.totalStars++;
  if (seg.group) it.mesh = makeStar(seg.group, lat, y, -s);
}

// ---------------------------------------------------------------------
// 9. CONTROLS
// ---------------------------------------------------------------------
const game = { state: "title", paused: false, soundOn: true, musicOn: true, chase: false,
  tracks: 0, stars: 0, bumps: 0, totalTracks: 0, totalStars: 0, homeT: 0, combo: 0, comboT: 0, birdT: 3 };

// Left or right: hop lanes, or turn if a corner is close.
function steer(way) {
  if (game.state !== "run") return;
  const seg = route[w.seg];
  if (seg.turn && seg.len - w.s < TURN_ZONE) {
    if (w.turnQueued) return;
    if (way === seg.turn) { w.turnQueued = true; sfx("turn"); }
    else { say(seg.fork ? "Not that way, coyotes! Follow the glowing tracks." : "The trail turns the other way!"); sfx("nope"); }
    return;
  }
  const lane = Math.max(-1, Math.min(1, w.lane + way));
  if (lane !== w.lane) { w.lane = lane; sfx("lane"); }
}
function jump() {
  if (game.state !== "run" || w.y > 0) return;
  w.vy = JUMP_V; w.duckT = 0; sfx("jump");
}
function duck() {
  if (game.state !== "run") return;
  w.duckT = DUCK_TIME;
  if (w.y > 0) w.vy = -14;   // ducking in the air drops Walter fast
  sfx("duck");
}

addEventListener("keydown", (e) => {
  const k = e.code;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(k)) e.preventDefault();
  if (k === "KeyM") { game.soundOn = !game.soundOn; applyVolume(); say(game.soundOn ? "Sound on" : "Sound off"); return; }
  if (k === "KeyN") { game.musicOn = !game.musicOn; applyVolume(); say(game.musicOn ? "Music on" : "Music off"); return; }
  if (game.state === "title" || game.state === "end") {
    if ((k === "Space" || k === "Enter") && !e.repeat) startRun();
    return;
  }
  if (game.state !== "run") return;
  if (k === "KeyP" || k === "Escape") { game.paused = !game.paused; say(game.paused ? "Paused (P to go)" : ""); return; }
  if (game.paused || e.repeat) return;
  if (k === "ArrowLeft" || k === "KeyA") steer(-1);
  if (k === "ArrowRight" || k === "KeyD") steer(1);
  if (k === "ArrowUp" || k === "KeyW" || k === "Space") jump();
  if (k === "ArrowDown" || k === "KeyS") duck();
});

// Swipes, for tablets: the longer direction of the swipe wins. A tap jumps.
let touch0 = null;
renderer.domElement.addEventListener("touchstart", (e) => { touch0 = e.touches[0]; }, { passive: true });
renderer.domElement.addEventListener("touchend", (e) => {
  if (!touch0) return;
  const t = e.changedTouches[0], dx = t.clientX - touch0.clientX, dy = t.clientY - touch0.clientY;
  touch0 = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return jump();
  if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1);
  else if (dy < 0) jump(); else duck();
});

// ---------------------------------------------------------------------
// SCREENS AND MESSAGES
// ---------------------------------------------------------------------
let msgTimer = null;
function say(text, secs = 1.8, alarm = false) {
  const el = $("msg");
  el.textContent = text;
  el.classList.toggle("alarm", alarm);
  el.style.opacity = text ? 1 : 0;
  clearTimeout(msgTimer);
  if (text) msgTimer = setTimeout(() => (el.style.opacity = 0), secs * 1000);
}

function best() {
  try { return JSON.parse(localStorage.getItem("walterRunBest")) || null; } catch (e) { return null; }
}
function saveBest(b) {
  try { localStorage.setItem("walterRunBest", JSON.stringify(b)); } catch (e) { /* private window: skip */ }
}

function showTitle() {
  $("card").style.display = "flex";
  document.querySelector("#card .box").innerHTML = `
    <h1>Walter the Wild</h1>
    <p class="big">Run Home!</p>
    <p>Major's stardust has made the bear tracks glow. Follow them through the woods to get home before dark.
    Keep an eye out for old friends along the way... and watch the sky!</p>
    <div class="keys">
      &#x2190; &#x2192; &nbsp;hop between lanes, and turn at corners<br>
      &#x2191; &nbsp;jump over logs and streams<br>
      &#x2193; &nbsp;duck under branches (and owls!)<br>
      Collect &#x1F43E; bear tracks and &#x2B50; stars!
    </div><br>
    <button id="go">Start running</button>`;
  $("go").onclick = startRun;
}

function showEnd() {
  const b = best() || { tracks: 0, stars: 0 };
  const newBest = game.tracks + game.stars * 5 > b.tracks + b.stars * 5;
  if (newBest) saveBest({ tracks: game.tracks, stars: game.stars });
  $("card").style.display = "flex";
  document.querySelector("#card .box").innerHTML = `
    <h1>Walter made it home!</h1>
    <p>Mom and Dad squeeze him tight.</p>
    <p class="big">&#x1F43E; ${game.tracks} of ${game.totalTracks} &nbsp; &#x2B50; ${game.stars} of ${game.totalStars}</p>
    <p>${game.bumps === 0 ? "Not a single stumble. Wow!" : game.bumps === 1 ? "Just 1 stumble." : game.bumps + " stumbles."}
    ${newBest ? "<br><b>That's your best run!</b>" : `<br>Best: &#x1F43E; ${b.tracks} &nbsp; &#x2B50; ${b.stars}`}</p>
    <button id="go">Run again</button>`;
  $("go").onclick = startRun;
}

// Plan a fresh route and put Walter at the start of it.
function newRoute(runSeed) {
  stopCameo();
  cameoNext = 0;
  route.forEach((seg) => seg.group && dropSegment(seg));
  route = makeRoute(runSeed);
  planClearings();
  game.totalTracks = 0; game.totalStars = 0;
  for (const seg of route) for (const it of seg.items) it.kind === "track" ? game.totalTracks++ : game.totalStars++;
  resetWalter();
  updateBuilt(0);
}

function startRun() {
  initAudio();
  if (game.state !== "title") newRoute(1 + Math.floor(Math.random() * 1e6));
  Object.assign(game, { state: "run", paused: false, chase: false, tracks: 0, stars: 0, bumps: 0, homeT: 0, combo: 0 });
  $("card").style.display = "none";
  say("Follow the glowing tracks home!", 2.4);
}

// ---------------------------------------------------------------------
// THE LOOP
// ---------------------------------------------------------------------
const BUMP_TEXT = {
  log: "Trip! Jump over logs with ↑",
  stream: "Splash! Jump over streams with ↑",
  branch: "Bonk! Duck under branches with ↓",
  block: "Oops! Go around it",
};

function bump(text, always, kind) {
  if (w.safeT > 0 && !always) return;
  w.stumbleT = 0.8; w.safeT = 1.8; w.speed *= 0.4;
  game.bumps++;
  game.combo = 0;
  const lost = Math.min(DROP_ON_BUMP, game.tracks);
  game.tracks -= lost;
  say(text + (lost ? `   (dropped ${lost} 🐾)` : ""), 2.2);
  sfx(kind === "stream" ? "splash" : "bump");
  if (lost) burst(w.viewPos.x, 0.8, w.viewPos.z, 0x9fe3ff, 18);
  if (kind === "stream") burst(w.viewPos.x, 0.3, w.viewPos.z, 0x6fb8e8, 24);
}

function checkObstacles(seg) {
  for (const ob of seg.obstacles) {
    if (ob.done || w.s < ob.s - 0.45) continue;
    let hit;
    if (ob.kind === "log") hit = w.y < 0.45;
    else if (ob.kind === "stream") hit = w.y < 0.3 && Math.abs(w.s - ob.s) < 0.85;
    else if (ob.kind === "branch") hit = w.duckT <= 0;
    else hit = w.y < 0.75 && ob.lanes.some((l) => Math.abs(w.lat - l * LANE_W) < 1.05);
    if (hit) { ob.done = true; bump(BUMP_TEXT[ob.kind], false, ob.kind); }
    else if (w.s > ob.s + (ob.kind === "stream" ? 0.85 : 0.45)) ob.done = true;   // made it past
  }
}

function checkItems(seg) {
  for (const it of seg.items) {
    if (it.taken || Math.abs(it.s - w.s) > 0.9 || Math.abs(it.lat - w.lat) > 0.95) continue;
    const reach = it.kind === "track" ? w.y < 1.3 : Math.abs(w.y + 0.9 - it.y) < 1.0;
    if (!reach) continue;
    it.taken = true;
    const p = worldXZ(seg, it.s, it.lat);
    if (it.mesh) it.mesh.visible = false;
    if (it.kind === "track") {
      game.tracks++;
      sfx("track", game.combo);
      game.combo++; game.comboT = 0.9;
      burst(p.x, 0.2, p.z, 0x9fe3ff, 6);
    } else {
      game.stars++;
      sfx("star");
      burst(p.x, it.y, p.z, 0xffd84a, 18);
    }
  }
}

function update(dt) {
  if (game.state === "run") updateRun(dt);
  else if (game.state === "home") updateHome(dt);
  animateWalter(dt);
  updateSparks(dt);
}

function updateRun(dt) {
  const seg = route[w.seg];
  const progress = (seg.start + w.s) / TOTAL;
  let target = SPEED_START + (SPEED_END - SPEED_START) * progress;
  if (game.chase) target *= CHASE_BOOST;
  if (w.stumbleT > 0) target *= 0.45;
  w.speed += (target - w.speed) * Math.min(1, dt * 1.5);
  w.s += w.speed * dt;

  // Slide toward the chosen lane.
  const goal = w.lane * LANE_W;
  w.lat += Math.sign(goal - w.lat) * Math.min(Math.abs(goal - w.lat), 12 * dt);

  // Jumping: up, then gravity pulls him back down.
  if (w.y > 0 || w.vy > 0) {
    w.vy -= GRAVITY * dt;
    w.y = Math.max(0, w.y + w.vy * dt);
    if (w.y === 0) { w.vy = 0; sfx("land"); }
  }
  w.duckT -= dt; w.stumbleT -= dt; w.safeT -= dt;
  game.comboT -= dt;
  if (game.comboT <= 0) game.combo = 0;

  // Now and then, a bird sings somewhere in the woods.
  game.birdT -= dt;
  if (game.birdT <= 0) { sfx("bird"); game.birdT = 3 + Math.random() * 6; }

  checkObstacles(seg);
  checkItems(seg);
  updateCameos(dt, progress);

  // The corner.
  const nearCorner = seg.turn && seg.len - w.s < TURN_ZONE && !w.turnQueued;
  $("turn").style.display = nearCorner ? "block" : "none";
  if (nearCorner) $("turn").textContent = seg.turn < 0 ? "← Turn left!" : "Turn right! →";

  if (w.s >= seg.len) {
    if (seg.last) { arriveHome(); return; }
    if (!w.turnQueued) bump("Oof, into the bushes! Turn where the tracks turn.", true);
    w.s -= seg.len;
    w.seg++;
    w.turnQueued = false;
    updateBuilt(w.seg);
  }
}

function arriveHome() {
  game.state = "home";
  game.homeT = 0;
  game.chase = false;
  stopCameo();
  $("turn").style.display = "none";
  say("Home!", 2);
  sfx("home");
}

function updateHome(dt) {
  // Walter slows to a stop in front of Mom and Dad.
  const seg = route[w.seg];
  w.speed = Math.max(0, w.speed - 11 * dt);
  w.s = Math.min(seg.len + 9, w.s + w.speed * dt);
  w.lat *= 1 - Math.min(1, dt * 3);
  w.y = Math.max(0, w.y - 6 * dt);
  game.homeT += dt;
  for (const p of [mom, dad]) {
    if (!p) continue;
    // Both wave with their right arm: raised high, swaying at the elbow.
    p.arms[1].shoulder.rotation.x = 2.7;
    p.arms[1].shoulder.rotation.z = -0.3;
    p.arms[1].elbow.rotation.z = Math.sin(game.homeT * 8) * 0.5;
  }
  if (game.homeT > 2.2 && game.state === "home") { game.state = "end"; showEnd(); }
}

// Smallest turn from angle a to angle b, so a corner never spins him the long way round.
function angleDiff(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

// Pose Walter's joints for this moment: running, jumping, ducking or standing.
function poseWalter(running) {
  const P = walter, L = P.legs, A = P.arms;
  const ducking = w.duckT > 0 && game.state === "run";
  const sn = Math.sin(w.phase), cs = Math.cos(w.phase);
  let rigY = 0, lean = -0.08, twist = 0, headX = 0;
  if (w.y > 0) {
    // In the air: one knee up, the other leg trailing, arms thrown up.
    L[0].hip.rotation.x = 1.1; L[0].knee.rotation.x = -1.4;
    L[1].hip.rotation.x = -0.35; L[1].knee.rotation.x = -0.7;
    A[0].shoulder.rotation.x = 2.3; A[1].shoulder.rotation.x = 2.5;
    A[0].elbow.rotation.x = A[1].elbow.rotation.x = 0.4;
    lean = -0.1;
  } else if (ducking) {
    // A deep crouch: hips drop, knees fold, body leans forward, head up.
    rigY = -0.36;
    for (const l of L) { l.hip.rotation.x = 1.5; l.knee.rotation.x = -2.35; l.ankle.rotation.x = 0.85; }
    for (const a of A) { a.shoulder.rotation.x = 0.7; a.elbow.rotation.x = 1.5; }
    lean = -0.7; headX = 0.5;
  } else if (running) {
    // Running: legs swing opposite, a knee folds as its leg swings forward,
    // arms pump against the legs with bent elbows, shoulders twist a little.
    L[0].hip.rotation.x = sn * 0.85; L[1].hip.rotation.x = -sn * 0.85;
    L[0].knee.rotation.x = -(0.2 + 1.25 * Math.max(0, cs));
    L[1].knee.rotation.x = -(0.2 + 1.25 * Math.max(0, -cs));
    L[0].ankle.rotation.x = L[1].ankle.rotation.x = 0;
    A[0].shoulder.rotation.x = -sn * 0.8; A[1].shoulder.rotation.x = sn * 0.8;
    A[0].elbow.rotation.x = A[1].elbow.rotation.x = 1.35;
    rigY = Math.abs(cs) * 0.04;
    lean = -0.2; twist = sn * 0.18;
  } else {
    for (const l of L) { l.hip.rotation.x = 0; l.knee.rotation.x = 0; l.ankle.rotation.x = 0; }
    for (const a of A) { a.shoulder.rotation.x = 0.05; a.elbow.rotation.x = 0.25; }
  }
  if (w.stumbleT > 0) {
    // Stumbling: pitched forward, arms flung out.
    lean = -0.75 * (w.stumbleT / 0.8);
    A[0].shoulder.rotation.x = A[1].shoulder.rotation.x = 1.9;
  }
  for (const [k, a] of A.entries()) a.shoulder.rotation.z = (k ? 1 : -1) * (w.stumbleT > 0 ? 0.7 : 0.12);
  P.rig.position.y = rigY;
  P.torso.rotation.x = lean;
  P.torso.rotation.y = twist;
  P.head.rotation.x = headX - lean * 0.6;   // keep his eyes on the trail
  P.head.rotation.y = -twist * 0.7;
}

function animateWalter(dt) {
  const seg = route[w.seg];
  const p = worldXZ(seg, w.s, w.lat);
  const k = 1 - Math.exp(-14 * dt);
  w.viewPos.x += (p.x - w.viewPos.x) * k;
  w.viewPos.z += (p.z - w.viewPos.z) * k;
  w.viewPos.y = w.y;
  w.viewAng += angleDiff(w.viewAng, seg.ang) * (1 - Math.exp(-7 * dt));

  walter.group.position.copy(w.viewPos);
  walter.group.rotation.y = w.viewAng;
  // Blink while he can't stumble again, so kids see he's safe for a moment.
  walter.group.visible = !(w.safeT > 0 && Math.floor(w.safeT * 10) % 2 === 0);

  const running = game.state === "run" || (game.state === "home" && w.speed > 0.5);
  w.phase += (running ? w.speed : 0) * dt * 0.95;
  poseWalter(running);
  // A soft footstep each time a foot lands.
  const step = Math.sign(Math.sin(w.phase));
  if (running && w.y === 0 && w.duckT <= 0 && step !== w.lastStep) { w.lastStep = step; sfx("step"); }

  blob.position.set(w.viewPos.x, 0.04, w.viewPos.z);
  const bs = 1.1 - Math.min(0.5, w.y * 0.25);
  blob.scale.set(bs, 1, bs);

  // Camera: behind and above Walter, looking a little ahead of him.
  // It sinks a bit when he's fast, which makes the speed feel bigger.
  const fx = -Math.sin(w.viewAng), fz = -Math.cos(w.viewAng);
  const back = 6.6 - (w.speed - SPEED_START) * 0.08;
  camera.position.set(w.viewPos.x - fx * back, 3.4 + w.y * 0.35, w.viewPos.z - fz * back);
  camera.lookAt(w.viewPos.x + fx * 6, 1.2, w.viewPos.z + fz * 6);
  sky.position.copy(camera.position);
  sun.target.position.copy(w.viewPos);
  sun.position.copy(w.viewPos).add(SUN_OFFSET);
  fill.target.position.copy(w.viewPos);
  fill.position.copy(camera.position).add(new THREE.Vector3(0, 4, 0));

  // Stars spin and bob; streams shimmer.
  const t = performance.now() / 1000;
  for (let i = Math.max(0, w.seg - 1); i <= Math.min(route.length - 1, w.seg + 2); i++) {
    for (const it of route[i].items) {
      if (it.kind === "star" && it.mesh) {
        it.mesh.rotation.y = t * 2.5;
        it.mesh.position.y = it.y + Math.sin(t * 3 + it.s) * 0.08;
      }
    }
    for (const ob of route[i].obstacles) if (ob.water) ob.water.material.emissive.setHSL(0.56, 0.6, 0.14 + Math.sin(t * 4) * 0.04);
  }
  updateFlies(t);
}

function drawHud() {
  $("nTracks").textContent = game.tracks;
  $("nStars").textContent = game.stars;
  const seg = route[w.seg];
  const pct = Math.min(1, (seg.start + w.s) / TOTAL) * 100;
  $("fill").style.width = pct + "%";
  $("me").style.left = pct + "%";
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);   // a long pause counts as one short step
  last = now;
  if (!game.paused) update(dt);
  drawHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

newRoute(1 + Math.floor(Math.random() * 1e6));
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
